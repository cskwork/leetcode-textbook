<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>LeetCode Textbook (Java) - 100 Problems, 16 Patterns</title>
  <meta name="description" content="A pattern-first, beginner-friendly guide to 100 LeetCode problems from Easy to Medium. Every problem is taught the same way: Intuition → Pseudocode → Java → Complexity → Dry-run.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%230969da' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z'/><path d='M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z'/></svg>">

  <!-- Theme color -->
  <meta name="theme-color" content="#0969da">

  <!-- Docsify base theme. docsify-themeable's latest published version is 0.9.0 and
       it ships its CSS under dist/css/ — any other version/path 404s and leaves the
       whole site unstyled, so keep this pinned and verify it 200s before changing. -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-themeable@0.9.0/dist/css/theme-simple.css">

  <!-- Prism syntax highlighting theme -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/themes/prism-tomorrow.min.css">

  <!-- Custom theme styles -->
  <style>
    :root {
      /* Base */
      --base-font-size: 16px;
      --base-line-height: 1.7;
      --base-font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      --heading-font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      --mono-font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', 'Cascadia Code', Menlo, Consolas, monospace;

      /* Light theme colors */
      --theme-color: #0969da;
      --theme-color-dark: #0550ae;
      --theme-color-light: #ddf4ff;

      --text-color: #1f2328;
      --text-color-light: #656d76;
      --heading-color: #1f2328;
      --heading-h1-border-color: #d0d7de;
      --heading-h2-border-color: #d8dee4;

      --background-color: #ffffff;
      --sidebar-background: #f6f8fa;
      --sidebar-border-color: #d0d7de;
      --sidebar-item-color: #1f2328;
      --sidebar-item-active-color: #0969da;
      --sidebar-item-active-background: #ddf4ff;
      --sidebar-width: 300px;

      --code-inline-background: #eff1f3;
      --code-inline-color: #1f2328;
      --code-block-background: #1e1e2e;
      --code-block-border-color: #313244;

      --table-row-odd-background: #f6f8fa;
      --table-border-color: #d0d7de;

      --blockquote-border-color: #0969da;
      --blockquote-background: #ddf4ff;
      --blockquote-color: #1f2328;

      --search-input-border-color: #d0d7de;
      --search-input-background: #ffffff;
      --search-result-background: #ffffff;
      --search-highlight-color: #0969da;

      --cover-background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);

      /* docsify-themeable paints a white .mask over the cover at 0.8 opacity by
         default, which washes the gradient out to grey. Hide it. */
      --cover-background-image: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      --cover-background-mask-visibility: hidden;
      --cover-max-width: 42em;
      --cover-blockquote-color: rgba(255,255,255,0.92);

      --link-color: #0969da;
      --link-color--hover: #0550ae;
    }

    /* Dark mode */
    html.dark-mode {
      --theme-color: #58a6ff;
      --theme-color-dark: #79c0ff;
      --theme-color-light: #0d2240;

      --text-color: #e6edf3;
      --text-color-light: #8b949e;
      --heading-color: #e6edf3;
      --heading-h1-border-color: #30363d;
      --heading-h2-border-color: #21262d;

      --background-color: #0d1117;
      --sidebar-background: #010409;
      --sidebar-border-color: #21262d;
      --sidebar-item-color: #e6edf3;
      --sidebar-item-active-color: #58a6ff;
      --sidebar-item-active-background: #161b22;

      --code-inline-background: #161b22;
      --code-inline-color: #e6edf3;

      --table-row-odd-background: #161b22;
      --table-border-color: #30363d;

      --blockquote-border-color: #58a6ff;
      --blockquote-background: #0d2240;
      --blockquote-color: #e6edf3;

      --search-input-border-color: #30363d;
      --search-input-background: #0d1117;
      --search-result-background: #161b22;
      --search-highlight-color: #58a6ff;

      --link-color: #58a6ff;
      --link-color--hover: #79c0ff;
    }

    /* === Base === */
    body {
      font-family: var(--base-font-family);
      font-size: var(--base-font-size);
      line-height: var(--base-line-height);
      color: var(--text-color);
      background-color: var(--background-color);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* === Headings === */
    .markdown-section h1, .markdown-section h2, .markdown-section h3,
    .markdown-section h4, .markdown-section h5, .markdown-section h6 {
      font-family: var(--heading-font-family);
      color: var(--heading-color);
      font-weight: 650;
      margin-top: 2em;
      margin-bottom: 0.8em;
    }

    .markdown-section h1 {
      font-size: 2em;
      padding-bottom: 0.3em;
      border-bottom: 2px solid var(--heading-h1-border-color);
      letter-spacing: -0.02em;
    }

    .markdown-section h2 {
      font-size: 1.5em;
      padding-bottom: 0.3em;
      border-bottom: 1px solid var(--heading-h2-border-color);
      letter-spacing: -0.01em;
    }

    .markdown-section h3 {
      font-size: 1.25em;
    }

    .markdown-section h4 {
      font-size: 1.1em;
    }

    /* docsify wraps headings in anchor <a> tags. They should look like headings,
       not blue underlined hyperlinks. */
    .markdown-section h1 a,
    .markdown-section h2 a,
    .markdown-section h3 a,
    .markdown-section h4 a {
      color: inherit !important;
      text-decoration: none !important;
    }

    /* === Links === */
    .markdown-section a {
      color: var(--link-color);
      text-decoration: none;
      transition: color 0.15s ease;
    }
    .markdown-section a:hover {
      color: var(--link-color--hover);
      text-decoration: underline;
    }

    /* === Code === */
    .markdown-section code, .markdown-section pre {
      font-family: var(--mono-font-family);
    }

    /* No `white-space: nowrap` here: long inline code (method signatures, URLs)
       would push the whole page into horizontal scroll on narrow screens. */
    .markdown-section code {
      background: var(--code-inline-background);
      color: var(--code-inline-color);
      padding: 0.2em 0.4em;
      border-radius: 5px;
      font-size: 0.875em;
      overflow-wrap: break-word;
    }

    .markdown-section pre {
      background: var(--code-block-background);
      border-radius: 10px;
      border: 1px solid var(--code-block-border-color);
      overflow: hidden;
    }

    .markdown-section pre > code {
      background: transparent;
      color: #e6edf3;
      padding: 0;
      border-radius: 0;
      font-size: 0.85em;
      line-height: 1.6;
      white-space: pre;
    }

    /* Prism override for code blocks */
    .markdown-section pre[class*="language-"] {
      background: var(--code-block-background);
      margin: 1.2em 0;
      padding: 1.2em 1.5em;
    }

    /* === Tables === */
    .markdown-section table {
      display: table;
      width: 100%;
      border-collapse: collapse;
      margin: 1.5em 0;
      border-radius: 8px;
      overflow: hidden;
    }

    .markdown-section th {
      background: var(--theme-color);
      color: #fff;
      font-weight: 650;
      padding: 0.75em 1em;
      text-align: left;
      border: 1px solid var(--theme-color-dark);
    }

    .markdown-section td {
      padding: 0.65em 1em;
      border: 1px solid var(--table-border-color);
    }

    .markdown-section tr:nth-child(2n) {
      background: var(--table-row-odd-background);
    }

    /* === Blockquotes === */
    .markdown-section blockquote {
      border-left: 4px solid var(--blockquote-border-color);
      background: var(--blockquote-background);
      padding: 0.8em 1.2em;
      margin: 1.2em 0;
      border-radius: 0 8px 8px 0;
      color: var(--blockquote-color);
    }

    .markdown-section blockquote p {
      margin: 0.5em 0;
    }

    /* === Details / Summary === */
    .markdown-section details {
      margin: 1em 0;
      border: 1px solid var(--table-border-color);
      border-radius: 8px;
      padding: 0.5em 1em;
      background: var(--table-row-odd-background);
      transition: border-color 0.2s;
    }

    .markdown-section details[open] {
      border-color: var(--theme-color);
    }

    .markdown-section summary {
      cursor: pointer;
      font-weight: 600;
      color: var(--theme-color);
      padding: 0.3em 0;
    }

    .markdown-section details[open] summary {
      margin-bottom: 0.5em;
      border-bottom: 1px solid var(--table-border-color);
      padding-bottom: 0.6em;
    }

    /* === Images === */
    .markdown-section img {
      border-radius: 8px;
      max-width: 100%;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    }

    /* === Lists === */
    .markdown-section ul, .markdown-section ol {
      padding-left: 1.5em;
    }

    .markdown-section li {
      margin-bottom: 0.3em;
    }

    /* === Sidebar === */
    .sidebar {
      background-color: var(--sidebar-background);
      border-right: 1px solid var(--sidebar-border-color);
      padding-top: 1.5rem;
      font-size: 14.5px;
    }

    .sidebar ul {
      list-style: none;
      padding-left: 0;
    }

    .sidebar ul ul {
      padding-left: 1.4em;
    }

    /* Sub-links: heading links (from subMaxLevel) and problem links */
    .sidebar ul ul a {
      font-size: 0.88em;
      color: var(--text-color-light);
      padding: 0.25em 0.6em;
      line-height: 1.3;
      border-left: 2px solid transparent;
    }
    .sidebar ul ul a:hover {
      color: var(--sidebar-item-active-color);
    }
    /* CRITICAL: docsify-themeable adds .active to the <li>, not the <a>.
       The theme styles `li.active > a`. docsify adds .active to the LAST
       heading's <li> and never clears it. We must override li.active
       and use our own class instead. */
    /* Neutralize theme's li.active > a on ALL sub-links */
    .sidebar ul ul li.active > a {
      color: var(--text-color-light) !important;
      font-weight: 400 !important;
      background: transparent !important;
      box-shadow: none !important;
      border-left-color: transparent !important;
    }
    /* Our scroll-spy highlight — the ONLY visible active state on sub-links */
    .sidebar ul ul li.scrollspy-active > a {
      color: var(--sidebar-item-active-color) !important;
      font-weight: 550 !important;
      background: transparent !important;
      box-shadow: none !important;
      border-left: 2px solid var(--theme-color) !important;
    }

    .sidebar li {
      margin: 0;
    }

    .sidebar a {
      color: var(--sidebar-item-color);
      display: block;
      padding: 0.35em 0.6em;
      border-radius: 6px;
      font-weight: 400;
      line-height: 1.4;
      transition: all 0.12s ease;
      text-decoration: none;
    }

    .sidebar a:hover {
      background: var(--sidebar-item-active-background);
      color: var(--sidebar-item-active-color);
      text-decoration: none;
    }

    .sidebar a.active {
      color: var(--sidebar-item-active-color);
      background: var(--sidebar-item-active-background);
      font-weight: 600;
    }

    /* Active link left accent bar — more visible than the canvas-effects ripple.
       The ripple (::before from canvas-effects.js) is fine for hover but the
       .active state needs a bolder indicator. */
    .sidebar a.active {
      box-shadow: inset 3px 0 0 var(--theme-color);
    }

    /* `8 problems` counts next to each pattern group — render as a quiet badge
       instead of raw monospace. */
    .sidebar code {
      font-family: var(--base-font-family);
      font-size: 0.72em;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: var(--text-color-light);
      background: var(--code-inline-background);
      border-radius: 999px;
      padding: 0.12em 0.6em;
      white-space: nowrap;
    }

    /* Pattern group headers: **Pattern N: Name** `count` 
       These render as <strong> + <code> inside <li>. Style as a non-link row
       that aligns with the links around it. */
    .sidebar > ul > li > strong {
      display: block;
      font-size: 0.82em;
      font-weight: 700;
      color: var(--text-color);
      padding: 0.6em 0.6em 0.25em;
      margin-top: 0.4em;
    }
    .sidebar > ul > li > strong + code,
    .sidebar > ul > li > code {
      font-family: var(--base-font-family);
      font-size: 0.7em;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: var(--text-color-light);
      background: var(--code-inline-background);
      border-radius: 999px;
      padding: 0.1em 0.5em;
      white-space: nowrap;
      margin-left: 0.2em;
    }

    .sidebar .pattern-header {
      font-size: 0.7em;
      font-weight: 750;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-color-light);
      padding: 1em 0.6em 0.3em;
      margin-top: 0.3em;
    }

    .sidebar .pattern-header:first-child {
      padding-top: 0;
    }

    /* Top-level link sizing */
    .sidebar > ul > li > a {
      font-weight: 550;
      font-size: 0.95em;
    }

    /* Search */
    .sidebar .search {
      margin: 0 1rem 1rem;
    }

    .sidebar .search input {
      width: 100%;
      padding: 0.55em 0.8em;
      border: 1px solid var(--search-input-border-color);
      border-radius: 8px;
      background: var(--search-input-background);
      color: var(--text-color);
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .sidebar .search input:focus {
      border-color: var(--theme-color);
      box-shadow: 0 0 0 3px var(--theme-color-light);
    }

    .sidebar .search .results-panel {
      background: var(--search-result-background);
      border-radius: 8px;
      padding: 0.5em;
      margin-top: 0.5em;
    }

    .sidebar .search .matching-post {
      padding: 0.5em 0.6em;
      border-radius: 6px;
      transition: background 0.12s;
    }

    .sidebar .search .matching-post:hover {
      background: var(--sidebar-item-active-background);
    }

    .sidebar .search p.empty {
      color: var(--text-color-light);
      padding: 0.5em;
      font-size: 0.85em;
    }

    .search a {
      color: var(--text-color);
    }

    /* === Content area === */
    .content {
      padding-top: 1.5rem;
    }

    .markdown-section {
      max-width: 850px;
      padding: 0 3rem 4rem;
    }

    /* === Cover page === */
    /* isolation:isolate makes .cover its own stacking context, so the effect
       canvases below can sit *between* the gradient and the text. Without it a
       negative z-index child is hoisted to the root context and paints behind
       the cover gradient — i.e. invisible. */
    .cover {
      background: var(--cover-background) !important;
      min-height: 100vh !important;
      isolation: isolate;
    }

    /* Only apply centering flex when cover is visible — docsify hides .cover
       without .show via display:none, so we must NOT force display here. */
    .cover.show {
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
    }

    /* Effect canvases (assets/glyph-rain.js, assets/liquid.js). Layer 0 = fluid,
       layer 1 = glyph rain, layer 2 = readability scrim, layer 3 = text. */
    .cover-liquid-canvas,
    .cover-glyph-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .cover-liquid-canvas { z-index: 0; opacity: 0.55; }
    .cover-glyph-canvas  { z-index: 1; opacity: 0.22; }

    /* Ambient blob layer injected by canvas-effects.js (inline z-index:-1, which
       now lands just above the cover gradient because .cover is isolated). */
    #fluid-canvas { opacity: 0.6; }

    /* Scrim: keeps cover copy legible over the animated layers. */
    .cover::after {
      content: '';
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background: radial-gradient(ellipse at center, rgba(20,16,45,0.45) 0%, rgba(20,16,45,0.15) 55%, transparent 100%);
    }

    .cover .cover-main {
      position: relative;
      z-index: 3;
      max-width: 680px;
      padding: 2rem;
      text-align: center;
    }

    /* Cover book icon */
    .cover .cover-main > p:first-child {
      margin-bottom: 1.2em;
    }
    .cover .cover-main > p:first-child svg {
      opacity: 0.9;
    }

    .cover h1 {
      font-size: 3.2em;
      margin-bottom: 0.3em;
      border: none !important;
      font-weight: 800;
      letter-spacing: -0.03em;
    }

    /* Docsify wraps the cover title in an <a>, which otherwise inherits the
       link colour and underline. Style both so the title reads as a title. */
    .cover h1,
    .cover h1 a {
      color: #fff !important;
      text-decoration: none !important;
      text-shadow: 0 2px 24px rgba(0,0,0,0.55), 0 1px 2px rgba(0,0,0,0.4);
    }

    /* Cover blockquote: the tagline */
    .cover blockquote {
      color: rgba(255,255,255,0.92) !important;
      background: rgba(255,255,255,0.08);
      border-left: none;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 16px;
      padding: 1.4em 1.8em;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      font-size: 1.05em;
      line-height: 1.8;
      margin: 1.5em auto 0;
      max-width: 520px;
    }

    .cover blockquote p {
      margin: 0.3em 0;
    }

    /* CTA button */
    .cover .cover-main .cover-cta {
      margin-top: 2em;
    }
    .cover .cover-main .cover-cta a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 100px;
      padding: 0.75em 2.4em;
      font-weight: 600;
      font-size: 1em;
      border: 1px solid rgba(255,255,255,0.3);
      color: #fff;
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: all 0.25s ease;
      letter-spacing: 0.02em;
      text-decoration: none;
      box-shadow: 0 4px 24px rgba(0,0,0,0.15);
    }

    .cover .cover-main .cover-cta a:hover {
      background: rgba(255,255,255,0.28);
      border-color: rgba(255,255,255,0.6);
      transform: translateY(-2px);
      box-shadow: 0 8px 32px rgba(0,0,0,0.25);
    }

    .cover .cover-main .cover-cta a svg {
      margin-right: 8px;
      flex-shrink: 0;
      pointer-events: none;
    }

    /* Badge: test status line */
    .cover .cover-badge {
      color: rgba(255,255,255,0.75);
      font-size: 0.82em;
      margin-top: 1.6em;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }
    .cover .cover-badge svg {
      color: #4ade80;
      flex-shrink: 0;
    }

    /* === SVG icon system === */
    /* Inline SVG icons replace emojis everywhere — they use currentColor so
       they automatically adapt to light/dark themes. */
    .nav-icon {
      width: 16px;
      height: 16px;
      margin-right: 7px;
      opacity: 0.65;
      flex-shrink: 0;
      transition: opacity 0.15s ease;
    }
    /* Fallback for browsers without :has() (older Safari) */
    .sidebar > ul > li > a > .nav-icon:first-child {
      vertical-align: -3px;
    }
    a:hover .nav-icon,
    .sidebar a:hover .nav-icon {
      opacity: 1;
    }
    .sidebar a.active .nav-icon {
      opacity: 1;
    }

    /* Sidebar links with icons: use flexbox so icon + text align cleanly.
       Only target links that contain an SVG icon — pattern sub-links and 
       problem links don't have icons and should stay block layout. */
    .sidebar > ul > li > a:has(> svg) {
      display: flex !important;
      align-items: center;
      padding-left: 0.6em;
    }

    .btn-icon {
      width: 20px;
      height: 20px;
      display: block;
    }

    /* Sidebar header icon (docsify name area) */
    .app-name-link svg,
    .app-name-link .nav-icon {
      width: 22px;
      height: 22px;
      vertical-align: -5px;
      margin-right: 4px;
      opacity: 0.85;
    }

    /* Sidebar section headers with icons — these are <p> tags inside the
       sidebar list, so override docsify's default <p> margins. */
    .sidebar p.section-header {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.68em;
      font-weight: 750;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-color-light);
      padding: 1.4em 0.6em 0.4em;
      margin: 0 !important;
      list-style: none;
    }
    .sidebar p.section-header svg {
      width: 13px;
      height: 13px;
      flex-shrink: 0;
      opacity: 0.55;
    }
    .sidebar p.section-header:first-child {
      padding-top: 0;
    }

    /* === Dark mode toggle === */
    .dark-mode-toggle {
      position: fixed;
      bottom: 1.2rem;
      right: 1.2rem;
      z-index: 200;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 2px solid var(--table-border-color);
      background: var(--background-color);
      color: var(--text-color);
      cursor: pointer;
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 12px rgba(0,0,0,0.1);
      transition: all 0.2s ease;
    }

    .dark-mode-toggle:hover {
      border-color: var(--theme-color);
      transform: scale(1.08);
    }

    /* === Scrollbar === */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--table-border-color);
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--text-color-light);
    }

    /* === Back to top === */
    .back-to-top {
      position: fixed;
      bottom: 5rem;
      right: 1.2rem;
      z-index: 200;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 2px solid var(--table-border-color);
      background: var(--background-color);
      color: var(--text-color);
      cursor: pointer;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 12px rgba(0,0,0,0.1);
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s ease;
    }

    .back-to-top.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .back-to-top:hover {
      border-color: var(--theme-color);
      color: var(--theme-color);
      transform: scale(1.08);
    }

    /* === App nav bar === */
    .app-nav {
      margin-right: 1.5rem;
    }

    .app-nav a {
      transition: color 0.15s;
    }

    /* === Footer text === */
    .markdown-section .footer-note {
      margin-top: 3rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--heading-h2-border-color);
      font-size: 0.85em;
      color: var(--text-color-light);
    }

    /* === HR === */
    .markdown-section hr {
      border: none;
      height: 1px;
      background: var(--heading-h2-border-color);
      margin: 2em 0;
    }

    /* === Mobile === */
    @media screen and (max-width: 768px) {
      .markdown-section {
        padding: 0 1.5rem 3rem;
      }
      .cover h1 {
        font-size: 2.2em;
      }
      .cover .cover-main {
        padding: 1rem 1.25rem;
      }
      .cover .cover-main > p:first-child svg {
        width: 40px !important;
        height: 40px !important;
      }
      .cover blockquote {
        font-size: 0.95em;
        padding: 1em 1.2em;
      }
      /* Let wide comparison tables scroll instead of forcing the page wider. */
      .markdown-section table {
        display: block;
        width: max-content;
        max-width: 100%;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
      }
      .markdown-section th,
      .markdown-section td {
        white-space: nowrap;
      }
      /* Keep the floating controls clear of the mobile sidebar toggle. */
      .back-to-top {
        bottom: 4.6rem;
      }
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script>
    // Dark mode management
    const darkModeKey = 'leetcode-textbook-dark-mode';
    const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    const savedDark = localStorage.getItem(darkModeKey);
    if (savedDark === 'true' || (savedDark === null && prefersDark)) {
      document.documentElement.classList.add('dark-mode');
    }

    // Docsify config
    window.$docsify = {
      name: '<svg class="nav-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg> LeetCode Textbook',
      repo: '',
      loadSidebar: true,
      subMaxLevel: 3,
      maxLevel: 3,
      loadNavbar: false,
      coverpage: true,
      onlyCover: false,
      auto2top: true,
      relativePath: false,
      search: {
        placeholder: 'Search problems, patterns...',
        noData: 'No results found',
        depth: 3,
        paths: 'auto',
        hideOtherSidebarContent: false,
      },
      copyCode: {
        buttonText: '<svg class="btn-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:inline;vertical-align:-3px;margin-right:4px;width:14px;height:14px;"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>Copy',
        errorText: 'Copy failed',
        successText: '<svg class="btn-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="display:inline;vertical-align:-3px;margin-right:4px;width:14px;height:14px;"><polyline points="20 6 9 17 4 12"/></svg>Copied!',
      },
      'flexible-alerts': {
        style: 'flat',
      },
      plugins: [
        // canvas-ui GlyphRain on the cover page only.
        function glyphRainEffect(hook) {
          var instance = null;
          var canvas = null;

          function teardown() {
            if (instance) { try { instance.destroy(); } catch (e) {} instance = null; }
            if (canvas) { canvas.remove(); canvas = null; }
          }

          function init() {
            if (instance || canvas) return;
            if (typeof window.GlyphRain === 'undefined' || !window.GlyphRain.createGlyphRain) return;
            var cover = document.querySelector('.cover');
            if (!cover) return;
            canvas = document.createElement('canvas');
            canvas.className = 'cover-glyph-canvas';
            cover.insertBefore(canvas, cover.firstChild);
            var dummySource = document.createElement('canvas');
            var content = cover.querySelector('.cover-main') || cover;
            try {
              instance = window.GlyphRain.createGlyphRain(
                { source: dummySource, content: content, output: canvas },
                {
                  color: [0.55, 0.85, 1],
                  headColor: [0.85, 0.95, 1],
                  cell: 22,
                  density: 0.07,
                  speed: 0.12,
                  trail: 0.5,
                  glow: 0.7,
                  stir: 0.5,
                  stirRadius: 240,
                  layers: 2
                }
              );
              if (!instance) { teardown(); }
            } catch (e) { teardown(); }
          }

          hook.doneEach(function () {
            var cover = document.querySelector('.cover');
            var isCoverVisible = !!(cover && cover.classList.contains('show'));
            if (!isCoverVisible) { teardown(); return; }
            init();
            if (!instance && !canvas) {
              requestAnimationFrame(init);
              setTimeout(init, 250);
            }
          });

          window.addEventListener('beforeunload', teardown);
        },
        // canvas-ui Liquid fluid simulation on the cover page.
        function liquidEffect(hook) {
          var instance = null;
          var canvas = null;

          function teardown() {
            if (instance) { try { instance.destroy(); } catch (e) {} instance = null; }
            if (canvas) { canvas.remove(); canvas = null; }
          }

          function init() {
            if (instance || canvas) return;
            if (typeof window.Liquid === 'undefined' || !window.Liquid.createLiquid) return;
            var cover = document.querySelector('.cover');
            if (!cover) return;
            canvas = document.createElement('canvas');
            canvas.className = 'cover-liquid-canvas';
            cover.insertBefore(canvas, cover.firstChild);
            var dummySource = document.createElement('canvas');
            var content = cover.querySelector('.cover-main') || cover;
            try {
              instance = window.Liquid.createLiquid(
                { source: dummySource, content: content, output: canvas },
                {
                  rainbow: true,
                  intensity: 1.5,
                  distortion: 0.3,
                  blend: 3,
                  densityDissipation: 0.97,
                  radius: 0.25,
                  force: 0.8
                }
              );
              if (!instance) { teardown(); }
            } catch (e) { teardown(); }
          }

          hook.doneEach(function () {
            var cover = document.querySelector('.cover');
            var isCoverVisible = !!(cover && cover.classList.contains('show'));
            if (!isCoverVisible) { teardown(); return; }
            init();
            if (!instance && !canvas) {
              requestAnimationFrame(init);
              setTimeout(init, 250);
            }
          });

          window.addEventListener('beforeunload', teardown);
        },
        function darkModeToggle(hook, vars) {
          hook.doneEach(function() {
            // Remove existing toggle
            const existing = document.querySelector('.dark-mode-toggle');
            const existingBtt = document.querySelector('.back-to-top');
            if (existing) existing.remove();
            if (existingBtt) existingBtt.remove();

            // Create dark mode toggle button
            const btn = document.createElement('button');
            btn.className = 'dark-mode-toggle';
            btn.title = 'Toggle dark mode';
            btn.innerHTML = document.documentElement.classList.contains('dark-mode')
              ? '<svg class="btn-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>'
              : '<svg class="btn-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
            btn.onclick = function() {
              const isDark = document.documentElement.classList.toggle('dark-mode');
              localStorage.setItem(darkModeKey, isDark);
              btn.innerHTML = isDark
                ? '<svg class="btn-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>'
                : '<svg class="btn-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
            };
            document.body.appendChild(btn);

            // Back to top button
            const btt = document.createElement('button');
            btt.className = 'back-to-top';
            btt.innerHTML = '<svg class="btn-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>';
            btt.title = 'Back to top';
            btt.onclick = function() { window.scrollTo({ top: 0, behavior: 'smooth' }); };
            document.body.appendChild(btt);

            window.addEventListener('scroll', function() {
              if (window.scrollY > 400) {
                btt.classList.add('visible');
              } else {
                btt.classList.remove('visible');
              }
            });

            // Add badge styling for problem links in sidebar
            document.querySelectorAll('.sidebar a').forEach(function(link) {
              const text = link.textContent.trim();
              // Add difficulty indicators
              if (text.match(/\b(Easy|Medium|Hard)\b/)) {
                const difficulty = text.match(/(Easy|Medium|Hard)/)[1];
                link.classList.add('difficulty-' + difficulty.toLowerCase());
              }
            });

            // Style pattern headers in sidebar
            document.querySelectorAll('.sidebar li > strong').forEach(function(el) {
              if (el.parentElement.tagName === 'LI') {
                const li = el.parentElement;
                li.classList.add('pattern-header-row');
              }
            });

            // === Sidebar scroll-spy ===
            // docsify-themeable adds .active to the <li> (not <a>). docsify marks
            // the last heading's <li> as active and never clears it. We use our
            // own .scrollspy-active class on the <li> and neutralize the theme's
            // li.active styling via CSS.
            (function setupScrollSpy() {
              if (window._scrollSpyHandler) {
                window.removeEventListener('scroll', window._scrollSpyHandler);
              }

              var headings = document.querySelectorAll('.markdown-section h2[id], .markdown-section h3[id]');
              if (!headings.length) return;

              // Map heading IDs to their sidebar <li> elements
              var headingMap = [];
              headings.forEach(function(h) {
                var id = h.getAttribute('id');
                // Use $= (ends-with) not *= (contains) so 'id=problem' 
                // doesn't match '?id=problems-in-this-section'
                var link = document.querySelector('.sidebar a[href$="?id=' + id + '"]');
                if (link && link.parentElement) {
                  headingMap.push({ heading: h, li: link.parentElement });
                }
              });
              if (!headingMap.length) return;

              function updateActive() {
                // Clear our class from all tracked <li>s
                headingMap.forEach(function(item) {
                  item.li.classList.remove('scrollspy-active');
                });

                // Find the heading currently in view
                var activeIdx = -1;
                var offset = 100;
                for (var i = headingMap.length - 1; i >= 0; i--) {
                  if (headingMap[i].heading.getBoundingClientRect().top <= offset) {
                    activeIdx = i;
                    break;
                  }
                }
                if (activeIdx >= 0) {
                  headingMap[activeIdx].li.classList.add('scrollspy-active');
                }
              }

              var ticking = false;
              window._scrollSpyHandler = function() {
                if (!ticking) {
                  requestAnimationFrame(function() {
                    updateActive();
                    ticking = false;
                  });
                  ticking = true;
                }
              };
              window.addEventListener('scroll', window._scrollSpyHandler, { passive: true });
              setTimeout(updateActive, 200);
              setTimeout(updateActive, 600);
            })();

            // === Canvas effects integration ===
            // Trigger route change in canvas-effects.js
            if (window.CanvasEffects) {
              window.CanvasEffects.onRouteChange();

              // Add effects toggle button (next to dark mode toggle)
              const existingFx = document.querySelector('.effects-toggle');
              if (existingFx) existingFx.remove();
              const fxBtn = document.createElement('button');
              fxBtn.className = 'effects-toggle';
              fxBtn.title = 'Toggle canvas effects';
              fxBtn.innerHTML = window.CanvasEffects.effectsEnabled
                ? '<svg class="btn-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.5 5L19 9.5 13.5 11 12 16l-1.5-5L5 9.5 10.5 8z"/><path d="M19 14l.75 2.5L22 17l-2.25.5L19 20l-.75-2.5L16 17l2.25-.5z"/></svg>'
                : '<svg class="btn-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.4"><path d="M12 3l1.5 5L19 9.5 13.5 11 12 16l-1.5-5L5 9.5 10.5 8z"/><line x1="3" y1="3" x2="21" y2="21"/></svg>';
              fxBtn.onclick = function() {
                window.CanvasEffects.toggleEffects();
                fxBtn.innerHTML = window.CanvasEffects.effectsEnabled
                  ? '<svg class="btn-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.5 5L19 9.5 13.5 11 12 16l-1.5-5L5 9.5 10.5 8z"/><path d="M19 14l.75 2.5L22 17l-2.25.5L19 20l-.75-2.5L16 17l2.25-.5z"/></svg>'
                  : '<svg class="btn-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.4"><path d="M12 3l1.5 5L19 9.5 13.5 11 12 16l-1.5-5L5 9.5 10.5 8z"/><line x1="3" y1="3" x2="21" y2="21"/></svg>';
              };
              document.body.appendChild(fxBtn);
            }
          });
        }
      ]
    };
  </script>

  <!-- Canvas effects (canvas-ui inspired) -->
  <script src="canvas-effects.js"></script>

  <!-- Docsify core -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.0/lib/docsify.min.js"></script>

  <!-- docsify-themeable runtime (pairs with the theme-simple.css above) -->
  <script src="https://cdn.jsdelivr.net/npm/docsify-themeable@0.9.0/dist/js/docsify-themeable.min.js"></script>

  <!-- canvas-ui GlyphRain (pre-compiled vanilla) -->
  <script src="assets/glyph-rain.js"></script>

  <!-- canvas-ui Liquid (pre-compiled vanilla) -->
  <script src="assets/liquid.js"></script>

  <!-- Docsify's own plugins live under lib/plugins/, not plugins/. -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.0/lib/plugins/search.min.js"></script>

  <!-- Copy code plugin (3.0.2 is the latest published version) -->
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@3.0.2/dist/docsify-copy-code.min.js"></script>

  <!-- Prism: Java syntax highlighting -->
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-java.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-bash.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-python.min.js"></script>

  <!-- Emoji rendering -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.0/lib/plugins/emoji.min.js"></script>

  <!-- Zoom image plugin -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.0/lib/plugins/zoom-image.min.js"></script>

  <!-- Callout blocks (> [!NOTE] / [!TIP] / [!WARNING]); the 'flexible-alerts'
       key in $docsify above is inert without this script. -->
  <script src="https://cdn.jsdelivr.net/npm/docsify-plugin-flexible-alerts@1.3.0/dist/docsify-plugin-flexible-alerts.min.js"></script>
</body>
