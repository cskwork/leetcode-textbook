<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Master LeetCode in tiny steps: 100 beginner-friendly Java problem lessons across 16 reusable patterns, taught one small step at a time.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f3eddf" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16221b" media="(prefers-color-scheme: dark)">
  <title>TRACE ATLAS — Master LeetCode in tiny steps</title>

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%23e64f2e' d='M5 5h22v22H5z'/%3E%3Cpath fill='%2316221b' d='M10 10h12v3H10zm0 5h8v3h-8zm0 5h12v3H10z'/%3E%3C/svg%3E">

  <script>
    (function initializeTraceAtlasTheme() {
      'use strict';

      var storageKey = 'trace-atlas:v1:theme';
      var root = document.documentElement;
      var savedTheme = null;

      try {
        savedTheme = window.localStorage.getItem(storageKey);
      } catch (error) {
        savedTheme = null;
      }

      if (savedTheme !== 'light' && savedTheme !== 'dark') {
        savedTheme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
          ? 'dark'
          : 'light';
      }

      root.dataset.taTheme = savedTheme;
      root.classList.toggle('dark-mode', savedTheme === 'dark');
      root.style.colorScheme = savedTheme;
    }());
  </script>

  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anybody:wdth,wght@75..125,400..900&amp;family=Atkinson+Hyperlegible:wght@400;700&amp;family=Recursive:MONO,wght@1,400;1,600&amp;display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-themeable@0.9.0/dist/css/theme-simple.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/themes/prism-tomorrow.min.css">
  <link rel="stylesheet" href="assets/atlas-theme.css">
</head>
<body>
  <a class="ta-skip-link" data-ta-action="skip-content" href="#app">Skip to the lesson</a>

  <div id="app" aria-busy="true">
    <main class="ta-loading" role="status" aria-live="polite" aria-labelledby="ta-loading-title">
      <p class="ta-loading__mark" aria-hidden="true">TA</p>
      <h1 id="ta-loading-title">Setting up your path…</h1>
      <p>Loading the curriculum and your device-local progress.</p>
    </main>
  </div>

  <aside id="trace-atlas-errors" class="ta-dependency-errors" aria-live="assertive" hidden></aside>

  <noscript>
    <main class="ta-no-script">
      <h1>TRACE ATLAS needs JavaScript for navigation</h1>
      <p>The lesson files are still available directly.</p>
      <p>
        <a href="README.md">Open the curriculum map</a>
        <a href="00-how-to-use-this-book.md">Read how to use this book</a>
      </p>
    </main>
  </noscript>

  <script>
    window.TraceAtlasDependencyError = function traceAtlasDependencyError(name, critical) {
      'use strict';

      var region = document.getElementById('trace-atlas-errors');
      var message = document.createElement('p');
      var dependency = name || 'A required resource';

      message.className = 'ta-dependency-error';
      message.textContent = dependency + ' could not load. Check your connection, then reload the page.';

      if (region) {
        region.hidden = false;
        region.appendChild(message);
      }

      if (critical) {
        var app = document.getElementById('app');
        if (app) {
          app.setAttribute('aria-busy', 'false');
          app.setAttribute('role', 'alert');
        }
      }

      if (window.console && typeof window.console.error === 'function') {
        window.console.error('[TRACE ATLAS] Failed to load ' + dependency + '.');
      }
    };
  </script>

  <!-- TRACE ATLAS enhancement must register before Docsify reads its config. -->
  <script src="assets/walkthrough-manifest.js" onerror="window.TraceAtlasDependencyError('Walkthrough capability map', false)"></script>
  <!-- Optional canvas layer: Canvas UI GlyphRain on the cover plus completion confetti. -->
  <script src="assets/glyph-rain.js" onerror="window.TraceAtlasDependencyError('Cover canvas effect', false)"></script>
  <script src="assets/atlas-fx.js" onerror="window.TraceAtlasDependencyError('Canvas effects layer', false)"></script>
  <script src="assets/atlas-shell.js" onerror="window.TraceAtlasDependencyError('TRACE ATLAS shell', true)"></script>
  <script src="assets/docsify-config.js" onerror="window.TraceAtlasDependencyError('Docsify configuration', true)"></script>

  <!-- Core and plugins are version-pinned so the static site remains reproducible. -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.0/lib/docsify.min.js" onerror="window.TraceAtlasDependencyError('Docsify core', true)"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-themeable@0.9.0/dist/js/docsify-themeable.min.js" onerror="window.TraceAtlasDependencyError('Docsify theme runtime', false)"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.0/lib/plugins/search.min.js" onerror="window.TraceAtlasDependencyError('Curriculum search', false)"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@3.0.2/dist/docsify-copy-code.min.js" onerror="window.TraceAtlasDependencyError('Code copying', false)"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-java.min.js" onerror="window.TraceAtlasDependencyError('Java syntax highlighting', false)"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-bash.min.js" onerror="window.TraceAtlasDependencyError('Bash syntax highlighting', false)"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-python.min.js" onerror="window.TraceAtlasDependencyError('Python syntax highlighting', false)"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.0/lib/plugins/emoji.min.js" onerror="window.TraceAtlasDependencyError('Emoji rendering', false)"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.0/lib/plugins/zoom-image.min.js" onerror="window.TraceAtlasDependencyError('Image zoom', false)"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-plugin-flexible-alerts@1.3.0/dist/docsify-plugin-flexible-alerts.min.js" onerror="window.TraceAtlasDependencyError('Lesson alerts', false)"></script>
</body>
</html>
